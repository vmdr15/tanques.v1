<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>battle tanks</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 20% 20%, rgba(0,255,0,0.18), transparent 16%),
                        radial-gradient(circle at 80% 15%, rgba(0,255,0,0.14), transparent 14%),
                        radial-gradient(circle at 50% 90%, rgba(255,255,255,0.08), transparent 12%),
                        linear-gradient(180deg, #020902 0%, #000 50%, #020902 100%);
            color: #0f0;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(0,255,0,0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.55;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0,255,0,0.05), transparent 45%, rgba(0,255,0,0.02));
            pointer-events: none;
        }

        .decor-circle {
            position: absolute;
            border: 1px solid rgba(0,255,0,0.35);
            border-radius: 50%;
            opacity: 0.6;
            pointer-events: none;
        }

        .decor-circle.small { width: 80px; height: 80px; }
        .decor-circle.medium { width: 140px; height: 140px; }
        .decor-circle.large { width: 220px; height: 220px; }

        h1 {
            margin-bottom: 30px;
            color: #0f0;
            position: relative;
            z-index: 1;
        }

        .button-link {
            display: inline-block;
            background-color: transparent;
            border: 2px solid #0f0;
            color: #0f0;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }

        .button-link:hover {
            background-color: rgba(0, 255, 0, 0.1);
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const recordValue = document.getElementById('recordValue');
            const record = localStorage.getItem('tankGameRecord') || 0;
            recordValue.textContent = record;
        });
    </script>
</head>
<body>
    <div class="decor-circle large" style="top: 8%; left: 10%;"></div>
    <div class="decor-circle medium" style="top: 18%; right: 12%;"></div>
    <div class="decor-circle small" style="bottom: 18%; left: 14%;"></div>
    <div class="decor-circle small" style="bottom: 12%; right: 16%;"></div>

    <h1>Bienvenido a mi juego de tanques</h1>
    <a class="button-link" href="tanques.html">Jugar</a>
    <p class="info" id="record">Récord de oleadas: <span id="recordValue">0</span></p>
</body>
</html>
